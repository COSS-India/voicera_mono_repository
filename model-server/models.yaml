# Catalogue of models the model-server can host.
#
# This is the single place a model is described. The gateway serves it at
# /models, so the frontend stops shipping its own hardcoded lists.
#
# status:
#   ready    - the container exists; add its id to .env to deploy it
#   planned  - chosen, not built yet
#
# Adding a model = one entry here, one folder, one compose profile.

stt:
  - id: indic-conformer
    name: AI4Bharat Indic Conformer 600M
    status: ready
    runtime: nemo
    sample_rate: 16000
    streaming: false
    languages: [hi, bn, ta, te, kn, ml, mr, gu, pa, or, as, ur, ne, sa, brx, doi, kok, ks, mai, mni, sat, sd, bhb]
    notes: Bhili (bhb) uses a separate checkpoint; enable with BHILI_ENABLE=yes.

  - id: indic-transcribe
    name: AI4Bharat / BodhanAI Indic-Transcribe 1.2B
    status: planned
    runtime: nemo
    languages: [26 Indian languages]

  - id: canary
    name: NVIDIA Canary
    status: planned
    runtime: nemo
    notes: European-language focus; role in an Indic stack still to be decided.

tts:
  - id: indic-parler
    name: AI4Bharat Indic Parler TTS
    status: ready
    runtime: parler
    sample_rate: 44100
    streaming: true
    voice: {presets: [Divya], free_text_description: true, cloning: false}
    languages: [hi, bn, ta, te, kn, ml, mr, gu, pa, or, as, ur, ne, sa, brx, doi, kok, ks, mai, mni, sat, sd, bhb]

  - id: indic-mio
    name: SPRINGLab Indic-Mio 0.6B
    status: planned
    runtime: vllm
    sample_rate: 44000
    voice: {cloning: true}
    notes: Qwen3-0.6B backbone with MioCodec; vLLM-servable.

  - id: orpheus
    name: Canopy Labs Orpheus TTS
    status: planned
    runtime: vllm
    sample_rate: 24000
    voice: {cloning: true}
    notes: Llama-3.2-3B backbone with SNAC codec.

  - id: omnivoice
    name: k2-fsa OmniVoice 0.6B
    status: planned
    runtime: pytorch
    voice: {cloning: true}
    notes: Diffusion-style, so not vLLM-servable; needs its own runtime.

llm:
  - id: qwen3-8b
    name: Qwen3-8B
    status: ready
    runtime: vllm
    quantization: fp8
    notes: Placeholder slot, disabled by default.

  - id: gemma
    name: Gemma
    status: planned
    runtime: vllm

  - id: llama
    name: Llama
    status: planned
    runtime: vllm
