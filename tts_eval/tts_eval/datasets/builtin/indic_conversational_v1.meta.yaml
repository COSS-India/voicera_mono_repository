id: indic_conversational_v1
version: "1.1.0"
description: >-
  Conversational voice-agent seed set: 124 utterances across 24 languages
  (en, hi, bn, ta, te, mr, gu, kn, ml, pa, or, as, ur, ne, mai, doi, hne,
  kok, sa, ks, sd, mni, brx, sat) in native scripts, spanning greeting,
  question, numeric, code_switch, long_form and two edge categories. Sized
  so a full run on one model is minutes, not hours, while still touching
  every metric family: long_form drives RTF and streaming stability, numeric
  and edge_symbols drive text normalisation, code_switch drives the
  Hindi-English mixing that is the common Indic TTS failure mode, and
  edge_short exposes the fixed latency floor.

# Pinned so an accidental edit fails the load instead of silently producing
# numbers that are not comparable with previous runs. To change the set:
# edit the .jsonl, bump `version`, then run `tts-eval dataset hash <file>`
# and paste the new value here.
