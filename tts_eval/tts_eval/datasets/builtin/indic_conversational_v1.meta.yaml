# --- provenance and limitations -------------------------------------------
# Authored for this harness; NOT a published corpus. Two consequences worth
# stating plainly in any report built on it:
#
#   1. The sentences have not been verified by native speakers of every one of
#      the 24 languages. Treat per-language CER from this set as indicative and
#      have a speaker review the language you are about to ship. In particular
#      ks, mni, brx, and sat utterances need native speaker validation.
#   2. It carries no reference recordings, so reference-based metrics
#      (speaker similarity to a target voice, TTSDS2 distributional scores)
#      report `not_computed` on it by design.
#
# For publication-grade numbers, point `--dataset` at a subset of IndicVoices-R
# (ai4bharat/indicvoices_r), which supplies ground-truth audio for 22 Indian
# languages and is the reference corpus Indic TTS work is benchmarked against.
# See docs/STANDARDS.md for the conversion recipe.
