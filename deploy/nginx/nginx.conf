resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=minio_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stt_limit:10m rate=200r/s;

# Only send `Connection: upgrade` to upstreams on requests that actually asked
# for an upgrade. Setting it unconditionally put `Connection: upgrade` with an
# empty `Upgrade` header on every plain HTTP request and broke upstream
# keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format stt_upstream '$remote_addr [$time_local] "$request" $status '
                        '$body_bytes_sent rt=$request_time '
                        'uct=$upstream_connect_time urt=$upstream_response_time '
                        'ua=$upstream_addr';

server {
    listen 8080;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/access.log stt_upstream;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    client_max_body_size 100M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /backend { return 301 /backend/; }

    location /backend/ {
        set $backend_up backend:8000;
        rewrite ^/backend(/.*)$ $1 break;
        proxy_pass http://$backend_up;
    }

    location /server/ {
        set $voice_up voice_server:7860;
        rewrite ^/server(/.*)$ $1 break;
        proxy_pass http://$voice_up;
    }

    location /ttslb {
        set $tts_up tts:8002;
        proxy_pass http://$tts_up;
    }

    # Indic-Mio TTS load-balancer. v2v points INDIC_MIO_SERVER_URL at
    # ws://nginx:8080/ttslb2/; nginx re-resolves `mio-tts` and round-robins replicas.
    location /ttslb2 {
        set $mio_up mio-tts:8003;
        proxy_pass http://$mio_up;
    }

    # STT load-balancer. Point the voice server at
    # INDIC_STT_SERVER_URL=http://nginx:8080/sttlb so nginx re-resolves `stt`
    # every 10 s and round-robins replicas; aiohttp keep-alive + DNS caching
    # pins every call to one replica if it talks to stt:8001 directly.
    location /sttlb/ {
        set $stt_up stt:8001;
        rewrite ^/sttlb(/.*)$ $1 break;

        limit_req zone=stt_limit burst=200 nodelay;
        limit_req_status 429;

        # 60 s of 16 kHz int16 PCM is ~2.6 MB of base64; the server rejects more
        # with 413 anyway. Stream it through instead of buffering the whole body.
        client_max_body_size 4m;
        proxy_request_buffering off;

        # Not the global 600 s: the caller gives up after 10 s, so a hung
        # upstream must not hold an nginx worker connection for 10 minutes.
        proxy_connect_timeout 2s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;

        proxy_pass http://$stt_up;
    }

    location = /minio { return 301 /minio/; }

    location /minio/ {
        set $minio_console minio:9001;
        rewrite ^/minio(/.*)$ $1 break;
        limit_req zone=minio_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        chunked_transfer_encoding off;
        proxy_pass http://$minio_console;
    }

    location / {
        set $app_up frontend:3000;
        proxy_pass http://$app_up;
    }
}
