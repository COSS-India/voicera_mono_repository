resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    client_max_body_size 100M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location = /backend { return 301 /backend/; }

    location /backend/ {
        set $backend_up backend:8000;
        rewrite ^/backend(/.*)$ $1 break;
        proxy_pass http://$backend_up;
    }

    location /server/ {
        set $voice_up voice_server:7860;
        rewrite ^/server(/.*)$ $1 break;
        proxy_pass http://$voice_up;
    }

    location /ttslb {
        set $tts_up tts:8002;
        proxy_pass http://$tts_up;
    }

    location / {
        set $app_up frontend:3000;
        proxy_pass http://$app_up;
    }
}
